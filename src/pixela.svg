<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <style>
    @font-face { font-family: "Noto Sans"; font-weight: 600; src: url({{font:noto-sans-600.woff2}}) format("woff2"); }
    text { font-family: "Noto Sans", sans-serif; font-weight: 600; }
    /* four real screenshots of Pixela at work, 2.5 s each over a 10 s loop, their name in sync */
    .feat { opacity: 0; animation: feat 10s linear infinite; }
    .feat.first { opacity: 1; }
    .f1 { animation-delay: -10s; } .f2 { animation-delay: -7.5s; } .f3 { animation-delay: -5s; } .f4 { animation-delay: -2.5s; }
    @keyframes feat { 0% { opacity: 0; } 4%, 25% { opacity: 1; } 29%, 100% { opacity: 0; } }
    .bob { animation: bob 1s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .shine { animation: shine 5s cubic-bezier(.4, 0, .2, 1) infinite; }
    @keyframes shine { 0% { transform: translateX(0); } 20%, 100% { transform: translateX(1040px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1280" height="320" rx="16"/></clipPath>
    <clipPath id="panel"><rect width="340" height="320"/></clipPath>
    <clipPath id="shot"><rect x="800" y="14" width="464" height="292" rx="10"/></clipPath>
    <clipPath id="btn"><rect x="380" y="222" width="384" height="80" rx="12"/></clipPath>
    <linearGradient id="gleam" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="#080b28"/>
    <g clip-path="url(#panel)">
      <rect width="340" height="320" fill="#ffe123"/>
      <g class="bob"><image href="{{img:pixela.png@440}}" x="-30" y="-44" width="420" height="420"/></g>
    </g>

    <text x="380" y="118" font-size="72" fill="#fff">Pixela</text>
    <text class="feat first f1" x="382" y="186" font-size="47" fill="#ffe123">Moderation</text>
    <text class="feat f2" x="382" y="186" font-size="47" fill="#ffe123">Tickets</text>
    <text class="feat f3" x="382" y="186" font-size="47" fill="#ffe123">Welcome cards</text>
    <text class="feat f4" x="382" y="186" font-size="47" fill="#ffe123">Auto-moderation</text>

    <rect x="380" y="222" width="384" height="80" rx="12" fill="#ffe123"/>
    <text x="414" y="277" font-size="48" fill="#080b28">Meet Pixela</text>
    <path d="M716 248l16 14-16 14" fill="none" stroke="#080b28" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g clip-path="url(#btn)">
      <g class="shine"><rect x="-140" y="214" width="90" height="100" fill="url(#gleam)" transform="skewX(-20)"/></g>
    </g>

    <g clip-path="url(#shot)">
      <image class="feat first f1" href="{{img:pixela-modo.png@928}}" x="800" y="14" width="464" height="292"/>
      <image class="feat f2" href="{{img:pixela-ticket.png@928}}" x="800" y="14" width="464" height="292"/>
      <image class="feat f3" href="{{img:pixela-welcome.png@928}}" x="800" y="14" width="464" height="292"/>
      <image class="feat f4" href="{{img:pixela-automod.png@928}}" x="800" y="14" width="464" height="292"/>
    </g>
  </g>
</svg>
