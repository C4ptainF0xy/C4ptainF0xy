    <g class="rise">
      <rect x="56" y="96" width="470" height="64" rx="32" fill="#a855f7" fill-opacity=".14" stroke="#a855f7" stroke-opacity=".55" stroke-width="2"/>
      <text class="mono" x="84" y="143" fill="#e9d5ff" font-size="48">@C4ptainF0xy</text>
      <rect class="cursor" x="450" y="108" width="24" height="42" rx="3" fill="#ec4899"/>
    </g>
    <g class="rise d1">
      <text class="name" x="56" y="282" font-size="104" letter-spacing="-2" fill="url(#nameink)">Sasha Da Silva</text>
      <g clip-path="url(#nameclip)"><g class="sweep"><rect x="-260" y="170" width="200" height="140" fill="url(#gleam)" transform="skewX(-18)"/></g></g>
    </g>
    <g class="rise d2" clip-path="url(#roles)">
      <text class="role first" x="56" y="372" style="animation-delay:-12s"><tspan fill="#a855f7">&gt; </tspan><tspan fill="url(#ink)">full-stack dev</tspan></text>
      <text class="role" x="56" y="372" style="animation-delay:-9s"><tspan fill="#a855f7">&gt; </tspan><tspan fill="url(#ink)">game server engineer</tspan></text>
      <text class="role" x="56" y="372" style="animation-delay:-6s"><tspan fill="#a855f7">&gt; </tspan><tspan fill="url(#ink)">drummer for 15 years</tspan></text>
      <text class="role" x="56" y="372" style="animation-delay:-3s"><tspan fill="#a855f7">&gt; </tspan><tspan fill="url(#ink)">rhythm game modder</tspan></text>
