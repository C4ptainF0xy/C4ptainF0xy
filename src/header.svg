<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
  <style>
    @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url({{font:space-grotesk-700.woff2}}) format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 600; src: url({{font:jetbrains-mono-600.woff2}}) format("woff2"); }
    .name { font-family: "Space Grotesk", sans-serif; font-weight: 700; }
    .mono, .role { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 50px; }
    .rise { animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; }
    .d1 { animation-delay: .12s; } .d2 { animation-delay: .3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    .aurora { animation: drift 12s ease-in-out infinite; }
    .aurora.b { animation-delay: -6s; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(90px, 40px) scale(1.12); } }
    .stars circle { fill: #f5e9ff; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .12; } 50% { opacity: .9; } }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 4s ease-in-out infinite; }
    @keyframes halo { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.07); opacity: 1; } }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 4s ease-in-out infinite; }
    @keyframes shadow { 0%, 100% { transform: scale(1); opacity: .7; } 50% { transform: scale(.82); opacity: .45; } }
    .spark { transform-box: view-box; transform-origin: 1192px 238px; animation: spark 2s ease-in-out infinite; }
    @keyframes spark { 0%, 100% { transform: scale(1) rotate(0); filter: brightness(1); } 50% { transform: scale(1.14) rotate(8deg); filter: brightness(1.25); } }
    .glint { transform-box: fill-box; transform-origin: center; animation: glint 2s ease-in-out infinite; }
    @keyframes glint { 0%, 100% { transform: scale(0); opacity: 0; } 40% { transform: scale(1) rotate(45deg); opacity: 1; } 70% { transform: scale(0) rotate(90deg); opacity: 0; } }
    .sweep { animation: sweep 4s cubic-bezier(.4, 0, .2, 1) infinite; }
    @keyframes sweep { 0% { transform: translateX(0); } 35%, 100% { transform: translateX(1100px); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .role { opacity: 0; animation: role 12s cubic-bezier(.2, .8, .2, 1) infinite; }
    .role.first { opacity: 1; }
    @keyframes role { 0% { opacity: 0; transform: translateY(46px); } 4%, 23% { opacity: 1; transform: none; } 27%, 100% { opacity: 0; transform: translateY(-46px); } }
    .eq rect { transform-box: fill-box; transform-origin: bottom; animation: hit .5s ease-out infinite; }
    @keyframes hit { 0% { transform: scaleY(1); } 12% { transform: scaleY(.3); } 100% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1280" height="560" rx="18"/></clipPath>
    <clipPath id="roles"><rect x="40" y="318" width="860" height="76"/></clipPath>
    <clipPath id="nameclip"><text class="name" x="56" y="282" font-size="104" letter-spacing="-2">Sasha Da Silva</text></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#160a24"/></linearGradient>
    <linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="120" x2="760"><stop offset="0" stop-color="#d8b4fe"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
    <linearGradient id="nameink" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9d5ff"/></linearGradient>
    <linearGradient id="gleam" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#f9a8d4" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="purple"><stop offset="0" stop-color="#a855f7" stop-opacity=".45"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop offset="0" stop-color="#ec4899" stop-opacity=".35"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#c084fc" stop-opacity=".55"/><stop offset=".55" stop-color="#ec4899" stop-opacity=".18"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="ground"><stop offset="0" stop-color="#000" stop-opacity=".75"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="560" fill="url(#sky)"/>
    <ellipse class="aurora" cx="220" cy="80" rx="520" ry="260" fill="url(#purple)"/>
    <ellipse class="aurora b" cx="980" cy="470" rx="560" ry="280" fill="url(#pink)"/>
    <g class="stars">
