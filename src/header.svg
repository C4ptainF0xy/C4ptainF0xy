      <rect x="210" y="454" width="9" height="46" rx="3" style="animation-delay:-0.375s"/>
      <rect x="224" y="474" width="9" height="26" rx="3" style="animation-delay:-0s"/>
      <rect x="238" y="462" width="9" height="38" rx="3" style="animation-delay:-0.125s"/>
      <rect x="252" y="482" width="9" height="18" rx="3" style="animation-delay:-0.25s"/>
      <rect x="266" y="458" width="9" height="42" rx="3" style="animation-delay:-0.375s"/>
