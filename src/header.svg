      <circle cx="744" cy="485" r="1.8" style="animation-duration:6s;animation-delay:-3.19s"/>
      <circle cx="58" cy="466" r="1.4" style="animation-duration:3s;animation-delay:-2.33s"/>
      <circle cx="309" cy="500" r="1.4" style="animation-duration:2s;animation-delay:-0.65s"/>
      <circle cx="587" cy="59" r="3" style="animation-duration:2s;animation-delay:-1.12s"/>
      <circle cx="149" cy="469" r="1.8" style="animation-duration:4s;animation-delay:-2.77s"/>
      <circle cx="823" cy="468" r="1.4" style="animation-duration:4s;animation-delay:-2.68s"/>
    </g>

    <circle class="halo" cx="1080" cy="290" r="300" fill="url(#halo)"/>
    <ellipse class="shadow" cx="1076" cy="548" rx="120" ry="16" fill="url(#ground)"/>
    <g class="rise d1"><g class="float">
      <image href="{{img:sona-base.png@620}}" x="930" y="10" width="297" height="540"/>
      <image class="spark" href="{{img:sona-sparkle.png@620}}" x="930" y="10" width="297" height="540"/>
      <path class="glint" d="M1240 170l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#fde68a" style="animation-delay:-.6s"/>
      <path class="glint" d="M1162 196l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fef3c7" style="animation-delay:-1.4s"/>
      <path class="glint" d="M1252 262l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fde68a" style="animation-delay:-.2s"/>
